name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env stub
        run: |
          cat > .env <<'EOF'
          COIN_RANKING_BASE_URL=https://api.coinranking.com/v2
          COIN_RANKING_API_KEY=stub
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          EOF

      - name: Generate localization
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
